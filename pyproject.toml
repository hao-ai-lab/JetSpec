[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jetspec"
version = "0.0.1"
description = "JetSpec — lightweight offline tree-speculative decoding on top of HF transformers (Qwen3-8B)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "transformers>=4.51,<5",   # Qwen3 from 4.51+; validated on 4.57.1
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
jetspec-plus-plus = ["safetensors", "huggingface_hub"]
jetspec-plus-plus-engine = [
    "torch==2.8.0+cu128", "triton==3.4.0", "transformers==4.57.1",
    "xxhash==3.5.0", "numpy==2.3.3", "safetensors==0.6.2", "tqdm==4.67.1",
    "flashinfer-python==0.5.2", "sgl-kernel==0.3.17.post1",
    "nvidia-cutlass-dsl==4.2.1", "wandb==0.22.0", "hf_transfer==0.1.9",
    "tiktoken==0.12.0", "datasets==4.6.1", "huggingface_hub==0.36.2",
    "ninja", "packaging",
]
kernel = ["triton"]
bench = [
    "datasets",
    "tqdm",
    "psutil",
    "ninja",
    "packaging",
]
flash-attn = [
    "flash-attn",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["psutil", "packaging", "ninja"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jetspec*"]

[tool.setuptools.package-data]
"jetspec.engines.jetspec_plus_plus" = ["README.md", "configs/*.json", "configs/*.txt", "artifacts/*.json"]
