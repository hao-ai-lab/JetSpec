[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jetflow"
version = "0.0.1"
description = "JetFlow — lightweight offline tree-speculative decoding on top of Hugging Face transformers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "transformers>=5.5,<6",    # Gemma 4 from 5.5+; Qwen3/Qwen3-MoE remain reference targets
    "accelerate>=1.0",         # direct low-memory placement for large/MoE targets
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
kernel = ["triton"]
bench = [
    "datasets",
    "psutil",
    "ninja",
    "packaging",
]
flash-attn = [
    "flash-attn",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["psutil", "packaging", "ninja"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jetflow*"]
